[project]
name = "youthlink-rag"
version = "0.1.0"
description = "YouthLink RAG 기반 청년 지원 챗봇 및 신청 가이드 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
